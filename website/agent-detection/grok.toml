id = "grok"
version = "2026.08.13.1"
min_engine_version = 2
updated_at = "2026-08-13T00:00:00Z"
aliases = ["grok-build"]

# Evidence: Grok Build 1.0.3 source and live pane reads.
#
# Grok emits OSC 0 titles by default. Idle is "grok" or
# "<session> - grok". During a turn, the configured title gains a braille
# spinner and activity text. Permission prompts add "⚠ Action Required";
# that prefix blinks while the terminal is unfocused, so visible blocker
# rules outrank the generic non-idle title rule.
#
# Grok also emits OSC 9;4 progress on supported terminals. Herdr retains the
# payload after "9;": "4;1;-1" while busy and "4;0;0" when idle.
#
# Working turns render one live status line directly above the prompt box:
#   "⠧ Waiting on subagent… 2.8s   13s ⇣29.7k [stop]"
#   "⠴ Explore /tmp/… + 1 more… 5.6s   19s ⇣29.7k [stop]"
# with a braille spinner and a trailing [stop] chip, plus an Esc:cancel
# footer hint. Permission prompts and ask-user-question dialogs replace the
# spinner with "◆" and draw a "┃"-guttered option list:
#   "┃  2 (○) Yes, proceed"
#   "┃  z (○) Type your answer here"
# with footer hints "1/3:select │ Ctrl+o:yolo │ Ctrl+c:cancel" (permission)
# or "Esc:unselect │ Tab:scrollback │ Shift+x:dismiss" (question dialog).
# Idle footers end with "Ctrl+x:shortcuts" or "Ctrl+.:shortcuts" and never contain "Esc:cancel".
#
# Background subagent hangover (Grok Build):
# After the parent turn yields, OSC title/progress and the footer can go
# idle while a child tool/subagent is still running. Live chrome then looks
# like:
#   "┃  ◆ Run Implement Phases J–O harness modules  [hooks: 3]"
#   "Worked for 11m13s. 1 command still running."
# Completed tools drop the ┃ gutter; option dialogs use "┃  N (○)" instead
# of "┃  ◆". These working rules must outrank osc_title_idle (1140) and
# osc_progress_idle (850), or the pane false-reports done/idle mid-wait.

[[rules]]
id = "osc_title_blocked"
state = "blocked"
priority = 1300
region = "osc_title"
visible_blocker = true
contains = ["Action Required"]

[[rules]]
id = "option_dialog_blocked"
state = "blocked"
priority = 1200
region = "whole_recent"
visible_blocker = true
line_regex = ['^\s*┃\s+[0-9a-z]+\s+\([●○]\)\s']

[[rules]]
id = "permission_hints_blocked"
state = "blocked"
priority = 1190
region = "bottom_non_empty_lines(2)"
visible_blocker = true
contains = [":select", "ctrl+o:yolo", "ctrl+c:cancel"]

[[rules]]
id = "question_dialog_hints_blocked"
state = "blocked"
priority = 1185
region = "bottom_non_empty_lines(2)"
visible_blocker = true
contains = ["tab:scrollback", "shift+x:dismiss"]

# Pre-0.2.x permission UI kept for older Grok Build releases.
[[rules]]
id = "permission_scope_selector"
state = "blocked"
priority = 1180
region = "whole_recent"
visible_blocker = true
contains = ["yes, proceed", "no, reject"]
any = [
  { contains = ["use ← → to choose permission whitelist scope"] },
  { contains = ["←/→:scope"] },
]

# Idle prompt footer rule outranks historical transcript lines in scrollback.
[[rules]]
id = "prompt_hints_idle"
state = "idle"
priority = 1160
region = "bottom_non_empty_lines(2)"
visible_idle = true
any = [
  { contains = ["ctrl+.:shortcuts"] },
  { contains = ["ctrl+x:shortcuts"] },
  { contains = ["shift+tab:mode"] },
]
not = [
  { contains = ["esc:cancel"] },
  { contains = ["ctrl+c:cancel"] },
]

# Parent turn has yielded, but a background tool/subagent is still live.
[[rules]]
id = "background_commands_still_running"
state = "working"
priority = 1150
region = "whole_recent"
visible_working = true
regex = ['\b\d+\s+commands?\s+still\s+running\b']

[[rules]]
id = "active_subagent_gutter_working"
state = "working"
priority = 1145
region = "whole_recent"
visible_working = true
# Active tool/subagent rows keep the ┃ gutter + ◆ marker.
# Permission option rows use "┃  N (○)" / "┃  z (○)" instead.
line_regex = ['^\s*┃\s+◆\s+\S']

[[rules]]
id = "waiting_on_subagent_working"
state = "working"
priority = 1142
region = "whole_recent"
visible_working = true
any = [
  { contains = ["waiting on subagent"] },
  { contains = ["waiting for subagent"] },
  { regex = ['\bwaiting on \d+ (?:background )?(?:task|command|subagent)s?\b'] },
]

[[rules]]
id = "osc_title_idle"
state = "idle"
priority = 1140
region = "osc_title"
visible_idle = true
regex = ['(?i)(?:^|.*[\s\-_—–])grok(?:[\s\-_—–].*)?\s*$']
not = [
  { regex = ['[\x{2800}-\x{28FF}]'] },
  { contains = ["[stop]"] },
]

# Active title with spinner or [stop] chip.
[[rules]]
id = "osc_title_working"
state = "working"
priority = 1000
region = "osc_title"
visible_working = true
any = [
  { regex = ['[\x{2800}-\x{28FF}]'] },
  { contains = ["[stop]"] },
]

# Deprioritized below prompt/title idle rules because Grok 1.0.x does not clear 9;4 progress on yield.
[[rules]]
id = "osc_progress_working"
state = "working"
priority = 900
region = "osc_progress"
visible_working = true
regex = ['^4;1;-1$']

[[rules]]
id = "osc_progress_idle"
state = "idle"
priority = 850
region = "osc_progress"
visible_idle = true
regex = ['^4;0;0$']

[[rules]]
id = "spinner_status_working"
state = "working"
priority = 200
region = "whole_recent"
visible_working = true
# Allow optional [↓]/chips between the status text and [stop].
line_regex = ['^\s*[\x{2801}-\x{28FF}]\s.*\[stop\]\s*$']

[[rules]]
id = "esc_cancel_hints_working"
state = "working"
priority = 190
region = "bottom_non_empty_lines(2)"
visible_working = true
contains = ["esc:cancel"]

# Pre-0.2.x working chrome kept for older Grok Build releases.
[[rules]]
id = "waiting_tool_working"
state = "working"
priority = 120
region = "whole_recent"
visible_working = true
any = [
  { all = [{ contains = ["ctrl+c:cancel", "ctrl+enter:interject"] }, { contains = ["waiting"] }] },
  { line_regex = ['^\s*[\x{2801}-\x{28FF}]\s+(Run|Read|Search|List)\b'] },
]
