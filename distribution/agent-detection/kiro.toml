id = "kiro"
version = "2026.09.16.1"
min_engine_version = 2
updated_at = "2026-09-16T00:00:00Z"
aliases = ["kiro-cli"]

[[rules]]
id = "live_prompt_idle"
state = "idle"
priority = 1100
region = "bottom_non_empty_lines(4)"
visible_idle = true
line_regex = ['(?i)^\s*[>›]\s*ask a question or describe a task(?:\s+(?:enter|↵))?\s*$']

[[rules]]
id = "tool_approval"
state = "blocked"
priority = 1050
region = "bottom_non_empty_lines(10)"
visible_blocker = true
contains = ["requires approval", "esc to close"]
any = [
  { contains = ["always allow", "deny"] },
  { contains = ["yes, single permission", "no (tab to edit)"] },
]

[[rules]]
id = "crew_approval"
state = "blocked"
priority = 1040
region = "bottom_non_empty_lines(8)"
visible_blocker = true
contains = [
  "tool approval",
  "approve all pending",
  "configure individually (agent monitor)",
  "exit (cancel subagents)",
]

[[rules]]
id = "question_panel"
state = "blocked"
priority = 1030
region = "bottom_non_empty_lines(8)"
visible_blocker = true
contains = ["to navigate", "to submit", "esc to cancel"]

[[rules]]
id = "live_working_footer"
state = "working"
priority = 950
region = "bottom_non_empty_lines(4)"
visible_working = true
contains = ["kiro is working", "type to steer", "ctrl+s to queue"]

[[rules]]
id = "osc_title_working"
state = "working"
priority = 900
region = "osc_title"
visible_working = true
regex = ['(?i)^[◐◓◑◒/|\\-]\s+kiro:']

[[rules]]
id = "osc_progress_working"
state = "working"
priority = 890
region = "osc_progress"
visible_working = true
regex = ['^4;3;?$']
