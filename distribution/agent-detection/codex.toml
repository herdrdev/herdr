id = "codex"
version = "2026.09.28.1"
min_engine_version = 3
updated_at = "2026-09-28T00:00:00Z"

[[rules]]
id = "osc_title_blocked"
state = "blocked"
priority = 1100
region = "osc_title"
visible_blocker = true
contains = ["Action Required"]

[[rules]]
id = "osc_title_working"
state = "working"
priority = 1050
region = "osc_title"
visible_working = true
regex = ['(?:^| )[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏](?: |$)']

[[rules]]
id = "transcript_viewer"
state = "unknown"
priority = 1000
region = "after_last_prompt_marker"
skip_state_update = true
contains = ["↑/↓ to scroll", "pgup/pgdn to", "home/end to jump", "q to quit"]
any = [
  { contains = ["esc to edit prev"] },
  { contains = ["esc/← to edit prev"] },
]

[[rules]]
id = "trust_directory"
state = "blocked"
priority = 950
region = "top_non_empty_lines(20)"
visible_blocker = true
all = [
  { regex = ['\A> You are in [^\r\n]+(?:\r?\n|$)'] },
  { regex = ['(?s)Do\s+you\s+trust\s+the\s+contents\s+of\s+this\s+directory\?'] },
]

[[rules]]
id = "folder_access_prompt"
state = "blocked"
priority = 980
region = "bottom_non_empty_lines(20)"
visible_blocker = true
all = [
  { contains = ["Folder access"] },
  { any = [
    { contains = ["Trust this folder?"] },
    { contains = ["Open existing task"] },
    { contains = ["Open restricted"] },
  ] },
  { line_regex = ['^[ \t]*(?:›[ \t]+)?1\.[ \t]+(?:Trust and continue|Open existing task|Open restricted)[ \t]*$'] },
  { regex = ['(?s)(?:^|\n)[ \t]*enter[ \t]+continue(?:[ \t]+and[ \t]+create[ \t]+sandbox)?[ \t]*·[ \t]*esc[ \t]+(?:quit|back)[ \t]*(?:\r?\n[ \t]*)*\z'] },
]

[[rules]]
id = "startup_hooks_review"
state = "blocked"
priority = 980
region = "bottom_non_empty_lines(16)"
visible_blocker = true
all = [
  { contains = ["Hooks need review", "Trust all and continue"] },
  { line_regex = ['^[ \t]*(?:›[ \t]+)?1\. Review hooks[ \t]*$'] },
  { regex = ['(?s)(?:^|\n)[ \t]*enter confirm · esc skip[ \t]*(?:\r?\n[ \t]*)*\z'] },
]

[[rules]]
id = "browser_sign_in"
state = "blocked"
priority = 970
region = "bottom_non_empty_lines(32)"
visible_blocker = true
all = [
  { contains = ["Finish signing in via your browser"] },
  { regex = ['(?s)(?:^|\n)[ \t]*Press esc to cancel[ \t]*(?:\r?\n[ \t]*)*\z'] },
]

[[rules]]
id = "request_user_input"
state = "blocked"
priority = 970
region = "bottom_non_empty_lines(12)"
visible_blocker = true
all = [
  { contains = ["Question ", "unanswered"] },
  { regex = ['(?s)(?:^|\n)[ \t]*(?:[\w+]+[ \t]+)*to[ \t]+submit[ \t]+(?:answer|all)[ \t]*\|[ \t]*esc[ \t]+to[ \t]+interrupt[ \t]*(?:\r?\n[ \t]*)*\z'] },
]

[[rules]]
id = "mcp_server_elicitation"
state = "blocked"
priority = 970
region = "bottom_non_empty_lines(18)"
visible_blocker = true
all = [
  { regex = ['(?m)^[ \t]*Field [0-9]+/[0-9]+(?: \([0-9]+ required unanswered\))?[ \t]*$'] },
  { regex = ['(?s)(?:^|\n)[ \t]*(?:enter|ctrl\+x enter)[ \t]+to submit[ \t]*\|[ \t]*esc to cancel[ \t]*(?:\r?\n[ \t]*)*\z'] },
]

[[rules]]
id = "model_migration"
state = "blocked"
priority = 975
region = "bottom_non_empty_lines(18)"
visible_blocker = true
all = [
  { any = [
    { contains = ["Codex just got an upgrade"] },
    { regex = ['(?m)^[ \t]*# Introducing [^\r\n]+$'] },
  ] },
  { regex = ['(?s)(?:^|\n)[ \t]*enter/esc[ \t]+(?:confirm|continue)[ \t]*·\s*ctrl\+c[ \t]+quit[ \t]*(?:\r?\n[ \t]*)*\z'] },
]

[[rules]]
id = "update_prompt_modal"
state = "blocked"
priority = 975
region = "bottom_non_empty_lines(20)"
visible_blocker = true
all = [
  { contains = ["Update available"] },
  { any = [
    { contains = ["Update now"] },
    { contains = ["Skip until next version"] },
  ] },
  { regex = ['(?s)(?:^|\n)[ \t]*enter[ \t]+continue[ \t]*·[ \t]*esc\s+skip[ \t]*(?:\r?\n[ \t]*)*\z'] },
]

[[rules]]
id = "interactive_choice"
state = "blocked"
priority = 940
region = "bottom_non_empty_lines(24)"
visible_blocker = true
all = [
  { regex = ['(?s)(?:^|\n)[ \t]*(?:enter[ \t]+select[ \t]*·[ \t]*esc[ \t]+(?:back|close)|enter[ \t]+confirm[ \t]*·[ \t]*esc[ \t]+back|tab[ \t]*/[ \t]*↑[ \t]↓[ \t]*move[ \t]*·[ \t]*enter[ \t]+select[ \t]*·[ \t]*esc[ \t]+close|Use ↑/↓ to move, enter to select, c to customize)[ \t]*(?:\r?\n[ \t]*)*\z'] },
  { any = [
    { line_regex = ['^[ \t]*›[ \t]*[0-9]+\.[ \t]+\S.*$'] },
    { line_regex = ['^[ \t]*[0-9]+\.[ \t]+\S.*$'] },
    { regex = ['(?m)^[ \t]*›[ \t]*\S.{1,}[ \t]{2,}\S.*$'] },
  ] },
]

[[rules]]
id = "safety_retry_confirmation"
state = "blocked"
priority = 970
region = "bottom_non_empty_lines(12)"
visible_blocker = true
all = [
  { contains = ["Stop this attempt and retry?"] },
  { regex = ['(?s)(?:^|\n)[ \t]*(?:›[ \t]+)?1\.[ \t]+Keep waiting[ \t]*\r?\n[ \t]*(?:›[ \t]+)?2\.[ \t]+Stop and retry[ \t]*(?:\r?\n[ \t]*)*\z'] },
]

[[rules]]
id = "startup_update"
state = "blocked"
priority = 950
region = "bottom_non_empty_lines(20)"
visible_blocker = true
contains = ["Update available!", "Update now"]
regex = ['Skip\s+until\s+next\s+version', 'Press enter to continue\s*\z']

[[rules]]
# Codex renders terminal failures above a returned composer. Keep these above
# idle but below working evidence so a resumed turn clears the blocker.
id = "auth_failure"
state = "blocked"
priority = 490
region = "bottom_non_empty_lines(12)"
visible_blocker = true
line_regex = ['^\s*›\s*$']
any = [
  { line_regex = ['^\s*■ Your access token could not be refreshed because your refresh token has expired\. Please log out and sign in again\.\s*$'] },
  { line_regex = ['^\s*■ Your access token could not be refreshed because your refresh token was already used\. Please log out and sign in again\.\s*$'] },
  { line_regex = ['^\s*■ Your access token could not be refreshed because your refresh token was revoked\. Please log out and sign in again\.\s*$'] },
  { line_regex = ['^\s*■ Your access token could not be refreshed\. Please log out and sign in again\.\s*$'] },
  { line_regex = ['^\s*■ Your access token could not be refreshed because you have since logged out or signed in to another account\. Please sign in again\.\s*$'] },
  { line_regex = ['^\s*■ Quota exceeded\. Check your plan and billing details\.\s*$'] },
]

[[rules]]
id = "api_error"
state = "blocked"
priority = 490
region = "bottom_non_empty_lines(12)"
visible_blocker = true
line_regex = ['^\s*›\s*$']
any = [
  { line_regex = ['^\s*■ request timed out\s*$'] },
  { line_regex = ['^\s*■ Connection failed: \S.*$'] },
  { line_regex = ['^\s*■ Error while reading the server response: \S.*$'] },
  { contains = ["■ We're currently experiencing high demand, which may cause temporary errors."] },
  { line_regex = ['^\s*⚠ Selected model is at capacity\. Please try a different model\.\s*$'] },
]

[[rules]]
# Plan usage exhausted: the agent resumes when the window rolls.
id = "usage_limit_reached"
state = "blocked"
priority = 960
region = "bottom_non_empty_lines(8)"
visible_blocker = true
usage_limit = true
any = [
  { contains = ["hit your usage limit"] },
  { contains = ["usage limit reached"] },
  { contains = ["rate limit"], any = [
    { contains = ["try again at"] },
    { contains = ["try again later"] },
  ] },
]

[[rules]]
id = "live_strong_blocker"
state = "blocked"
priority = 900
region = "after_last_prompt_marker"
visible_blocker = true
any = [
  { contains = ["press enter to confirm or esc to cancel"] },
  { regex = ['(?i)press enter to confirm or esc to\s+cancel'] },
  { contains = ["press enter to confirm or esc to go back"] },
  { contains = ["enter to submit answer"] },
  { contains = ["enter to submit all"] },
  { contains = ["allow command?"] },
  { contains = ["All Results", "Filesystem Only", "Plugins"] },
]

[[rules]]
id = "weak_blocker"
state = "blocked"
priority = 600
region = "whole_recent_without_current_prompt_marker"
# Sparkles can replace the space after ›. A later response marker makes that prompt stale.
not = [{ regex = ['(?m)^›[⠁⠂⠄⠈⠐⠠⡀⢀][^\n]*(?:\n(?:[^•■✗✓\n][^\n]*)?)*\z'] }]
any = [
  { contains = ["[y/n]"] },
  { contains = ["yes (y)"] },
  { contains = ["do you want to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
  { contains = ["would you like to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
]

[[rules]]
id = "screen_working_fallback"
state = "working"
priority = 500
region = "before_current_prompt_marker"
visible_working = true
# Support animated and reduced-motion status, including dynamic activity labels.
# The interrupt hint can be remapped, unbound, or hidden, and queued inputs can
# sit below the status. Require the live timer suffix with no later response.
any = [{ contains = [" to interrupt)"] }, { contains = ["s)"] }]
regex = ['(?m)^(?:[•◦][ \t]+)?[^\s›•◦■✗✓─][^\r\n]* \((?:[0-9]+[hm] )*[0-9]+s(?: • [^\r\n]+? to interrupt)?\)(?: · [^\r\n]*)?(?:\r?\n(?:[^•◦›■✗✓─\r\n][^\r\n]*|•[ \t]+(?:Queued\s+follow-up\s+inputs|Messages\s+to\s+be\s+submitted\s+after\s+next\s+tool\s+call(?:\s+\(press\s+[^\r\n]+?\s+to\s+interrupt\s+and\s+send\s+immediately\))?|Messages\s+to\s+be\s+submitted\s+at\s+end\s+of\s+turn)|›[⠁⠂⠄⠈⠐⠠⡀⢀][^\r\n]*)?)*\s*\z']
# A failed reconnect keeps its final elapsed timer but is no longer working.
not = [{ line_regex = ['^(?:[•◦][ \t]+)?Reconnect failed — check the endpoint, then relaunch \([0-9hms ]+\)$'] }]

[[rules]]
id = "osc_title_idle"
state = "idle"
priority = 100
region = "osc_title"
visible_idle = true
regex = ['\S']
not = [
  { regex = ['(?:^| )[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏](?: |$)'] },
  { contains = ["Action Required"] },
]
