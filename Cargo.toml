[package]
name = "herdr"
version = "0.9.5"
edition = "2021"
build = "build.rs"
description = "terminal workspace manager for AI coding agents"
license = "Apache-2.0"
repository = "https://github.com/herdrdev/herdr"
homepage = "https://herdr.dev"
keywords = ["terminal", "tui", "ai", "agents", "multiplexer"]
categories = ["command-line-utilities"]
include = [
    "src/**/*",
    "assets/sounds/*",
    "docs/next/api/herdr-api.schema.json",
    "skills/herdr/SKILL.md",
    "distribution/install.ps1",
    "README.md",
    "LICENSE",
    "Cargo.toml",
]

[workspace]
members = ["crates/ghostty-vt"]
default-members = [".", "crates/ghostty-vt"]

[dependencies]
ghostty-vt = { path = "crates/ghostty-vt" }
base64 = "0.22.1"
bincode = { version = "2", features = ["serde"] }
bytes = "1"
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context", "string"] }
clap_complete = "4.5"
crossterm = "0.29"
ctrlc = { version = "3", features = ["termination"] }
interprocess = "2.4.2"
jsonc-parser = { version = "0.33.1", default-features = false, features = ["cst", "serde_json"] }
libc = "0.2"
# ES256 JWT signing for APNs push auth (see src/push). Pure-Rust (RustCrypto, same family as sha2);
# no TLS/socket stack — push delivery shells out to curl like `herdr update` does, so this adds crypto
# only, not in-process networking.
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
portable-pty = "=0.9.0"
png = "0.17"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3.47", features = ["formatting"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "signal"] }
toml = "0.8"
toml_edit = "0.22.27"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2"
unicode-segmentation = "1.13.1"
schemars = { version = "1.2.1", features = ["derive"] }
# Cryptographic randomness for pairing tokens. Already present transitively via p256;
# promoted to a direct dep because `generate_machine_id` is explicitly disclaimed as
# non-secret and must not be reused for a credential.
getrandom = "0.2"
# Zero-dependency QR encoder (Project Nayuki), for `herdr pair`. Chosen over the
# alternatives because it adds NO transitive dependencies, which matters in a tree
# that has deliberately avoided pulling in rand/uuid/hex.
qrcodegen = "1.8.0"
rusqlite = { version = "0.41.0", features = ["bundled"] }

[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }

[target.'cfg(target_os = "linux")'.dependencies]
# logind's delay inhibitor lets the server save before host shutdown kills panes.
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
# UTF-16 SDDL input for interprocess security descriptors.
widestring = "1.2"
wmi = { version = "0.18.4", default-features = false }
# Native Notification Center delivery for unpackaged Windows installs.
windows = { version = "0.62.2", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_System_Com"] }
windows-sys = { version = "0.61.2", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
# Guest access relay link (src/guest/link), the one documented exception to
# keeping TLS and internet traffic out of process: while guests exist, the daemon
# keeps one outbound WSS socket to the HerdrUp guest relay, and each guest session
# through it is end-to-end encrypted with Noise IK (snow). TLS uses rustls on
# ring with the webpki root set.
snow = { version = "0.10", default-features = false, features = ["use-chacha20poly1305", "use-curve25519", "use-getrandom", "use-sha2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
webpki-roots = "1"
