[profile.default]
# Unit tests keep nextest's no-retry policy. Only the PTY integration binaries
# below receive retries because their process and terminal timing can vary.
retries = 0

[[profile.default.overrides]]
filter = "binary(multi_client) | binary(live_handoff) | binary(detach_reattach)"
retries = 2
# terminate-after turns a stalled PTY test into a failure after two slow periods.
# Without it a stuck test is only labelled slow and waited on forever: on
# 2026-09-21 an ubuntu CI job sat 15m19s on a suite that normally takes 6m,
# and was cancelled with the test binary still alive, reporting nothing.
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.default.overrides]]
filter = "all()"
# Bound intermittent unit-test hangs like the ubuntu focus-room regression after #579.
slow-timeout = { period = "60s", terminate-after = 3 }
