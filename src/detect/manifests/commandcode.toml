id = "commandcode"
version = "2026.08.16.1"
min_engine_version = 1
updated_at = "2026-08-16T00:00:00Z"
aliases = ["cmdcode"]

[[rules]]
id = "trust_directory"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
all = [
  { contains = ["do you trust the files in this folder?"] },
  { any = [{ contains = ["enter to select"] }, { contains = ["↑/↓ to navigate"] }] },
]

[[rules]]
id = "permission_required"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
all = [
  { contains = ["would you like to"] },
  { any = [{ contains = ["enter to confirm"] }] },
]

[[rules]]
id = "interrupt_hint_working"
state = "working"
priority = 110
region = "whole_recent"
visible_working = true
any = [
  { contains = ["esc to interrupt"] },
  { contains = ["◇"] },
]
