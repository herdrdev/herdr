id = "copilot"
version = "2026.08.12.1"
min_engine_version = 4
updated_at = "2026-08-12T14:05:03Z"
aliases = ["github-copilot", "ghcs"]

[resume_options]
flags = [
  "--allow-all",
  "--allow-all-tools",
  "--allow-all-urls",
  "--autopilot",
  "--plan",
  "--disallow-temp-dir",
  "--enable-memory",
  "--enable-reasoning-summaries",
  "--experimental",
  "--no-experimental",
  "--no-ask-user",
  "--no-custom-instructions",
  "--yolo",
]
options = [
  "--agent",
  "--effort",
  "--reasoning-effort",
  "--max-ai-credits",
  "--max-autopilot-continues",
  "--mode",
  "--model",
  "--stream",
]

[[rules]]
id = "selection_blocker"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
all = [
  { any = [
    { contains = ["esc to cancel"] },
    { contains = ["esc cancel"] },
  ] },
  { any = [
    { contains = ["enter to select"] },
    { contains = ["enter to confirm"] },
    { contains = ["enter to submit"] },
    { contains = ["enter accept"] },
  ] },
]

[[rules]]
id = "working_cancel_hint"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
any = [
  { contains = ["esc to cancel"] },
  { contains = ["esc cancel"] },
  { contains = ["esc again to cancel"] },
  { contains = ["esc interrupt"] }
]
