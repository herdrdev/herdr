id = "claude"
version = "2026.09.27.1"
min_engine_version = 2
updated_at = "2026-09-27T00:00:00Z"
aliases = ["claude-code"]

[[rules]]
id = "osc_title_working"
state = "working"
priority = 1100
region = "osc_title"
visible_working = true
# Braille covers <= 2.1.227; half-circles are the 2.1.228 busy spinner.
regex = ['^[\x{2800}-\x{28FF}\x{25D0}-\x{25D3}] ']

[[rules]]
id = "live_turn_working"
state = "working"
priority = 970
region = "bottom_non_empty_lines(12)"
visible_working = true
any = [
  { line_regex = ['^\s*(?:--\s*\w+\s*--\s*)?[⏸⏵].*esc to interrupt(?:\s|·|$)'] },
  { line_regex = ['^\s*[\x{002A}\x{00B7}\x{2722}\x{2733}\x{2736}\x{273B}\x{273D}]\s+\S.*…(?:\s+\(\d+[smh](?:\s|·)|\s*$)'] },
]

[[rules]]
id = "background_shell_working"
state = "working"
priority = 965
region = "bottom_non_empty_lines(5)"
visible_working = true
line_regex = ['^\s*[⏸⏵].*·\s+[1-9]\d*\s+shells?\s+(?:·|$)']

[[rules]]
id = "background_subagents_working"
state = "working"
priority = 965
region = "bottom_non_empty_lines(5)"
visible_working = true
# Claude offers the /tasks hint on the status row only while subagent tasks are
# still running, and drops it once the last one finishes. That makes it the one
# control that survives the parent returning to an idle prompt. The vim mode
# indicator can prefix the row.
line_regex = ['^\s*(?:--\s*\w+\s*--\s*)?[⏸⏵].*·\s*/tasks to see subagents(?:\s*·|\s*$)']
not = [
  { contains = ["do you want to proceed?"] },
  { contains = ["esc to cancel"] },
  { contains = ["waiting for permission"] },
  { contains = ["do you want to allow this connection?"] },
  { contains = ["tab to amend"] },
  { contains = ["ctrl+e to explain"] },
]

[[rules]]
id = "background_agents_working"
state = "working"
priority = 965
region = "last_non_empty_above_prompt_box"
visible_working = true
line_regex = ['^\s*[\x{002A}\x{00B7}\x{2722}\x{2736}\x{273B}\x{273D}]\s+Waiting for [1-9]\d* background agents? to finish\s*$']

[[rules]]
id = "background_mcp_task_working"
state = "working"
priority = 965
region = "bottom_non_empty_lines(12)"
visible_working = true
# Claude renders activity summaries at column zero; wrapped continuations are indented.
# Keeping that shape prevents user prompt text from impersonating this signal.
regex = ['(?m)^[\x{002A}\x{00B7}\x{2722}\x{2736}\x{273B}\x{273D}][ \t]+\S[^\n]*?(?:\n[ \t]+[^\n]*?){0,3}·(?:[ \t]+|\n[ \t]*)[1-9]\d*(?:[ \t]+|\n[ \t]*)MCP(?:[ \t]+|\n[ \t]*)tasks?(?:[ \t]+|\n[ \t]*)still(?:[ \t]+|\n[ \t]*)running[ \t]*$']
not = [
  { contains = ["do you want to proceed?"] },
  { contains = ["esc to cancel"] },
  { contains = ["waiting for permission"] },
  { contains = ["do you want to allow this connection?"] },
  { contains = ["tab to amend"] },
  { contains = ["ctrl+e to explain"] },
]

[[rules]]
id = "btw_overlay_working"
state = "working"
priority = 975
region = "bottom_non_empty_lines(5)"
visible_working = true
line_regex = [
  '^\s*/btw(?:\s|$)',
  '(?i)esc to close\s*$',
]

[[rules]]
id = "transcript_viewer"
state = "unknown"
priority = 1000
region = "bottom_non_empty_lines(3)"
skip_state_update = true
contains = ["showing detailed transcript"]
any = [
  { contains = ["ctrl+o", "to toggle"] },
  { contains = ["ctrl+e", "show all"] },
  { contains = ["ctrl+e", "collapse"] },
  { contains = ["↑↓ scroll"] },
  { contains = ["? for shortcuts"] },
]

[[rules]]
id = "live_blocked_form"
state = "blocked"
priority = 1200
region = "after_last_horizontal_rule"
visible_blocker = true
regex = ['(?i)esc(?:[ \t]+|[ \t]*\n[ \t]*)to(?:[ \t]+|[ \t]*\n[ \t]*)cancel']
any = [
  { regex = ['(?i)enter(?:[ \t]+|[ \t]*\n[ \t]*)to(?:[ \t]+|[ \t]*\n[ \t]*)confirm'] },
  { regex = ['(?i)enter(?:[ \t]+|[ \t]*\n[ \t]*)to(?:[ \t]+|[ \t]*\n[ \t]*)select'], any = [
    { regex = ['(?i)tab/arrow(?:[ \t]+|[ \t]*\n[ \t]*)keys(?:[ \t]+|[ \t]*\n[ \t]*)to(?:[ \t]+|[ \t]*\n[ \t]*)navigate'] },
    { regex = ['(?i)arrow(?:[ \t]+|[ \t]*\n[ \t]*)keys(?:[ \t]+|[ \t]*\n[ \t]*)to(?:[ \t]+|[ \t]*\n[ \t]*)navigate'] },
    { regex = ['(?i)arrows(?:[ \t]+|[ \t]*\n[ \t]*)to(?:[ \t]+|[ \t]*\n[ \t]*)navigate'] },
    { regex = ['(?i)↑/↓(?:[ \t]+|[ \t]*\n[ \t]*)to(?:[ \t]+|[ \t]*\n[ \t]*)navigate'] },
    { regex = ['(?i)↑↓(?:[ \t]+|[ \t]*\n[ \t]*)to(?:[ \t]+|[ \t]*\n[ \t]*)navigate'] },
  ] },
]

[[rules]]
id = "plan_approval_prompt"
state = "blocked"
priority = 1200
region = "after_last_horizontal_rule"
visible_blocker = true
# The ExitPlanMode approval dialog has no "Esc to cancel" footer, and at normal
# widths "Would you like to proceed?" wraps, so live_blocked_form and the
# contains gate in legacy_no_prompt_blocker both miss it and the idle OSC title
# wins. Gate on the invariant header sentence (wrap-tolerant) and at least one
# numbered option. The plan path and ctrl+g editor hint vary, so they stay out.
regex = [
  '(?i)ready(?:[ \t]+|[ \t]*\n[ \t]*)to(?:[ \t]+|[ \t]*\n[ \t]*)execute',
  '(?i)would(?:[ \t]+|[ \t]*\n[ \t]*)you(?:[ \t]+|[ \t]*\n[ \t]*)like(?:[ \t]+|[ \t]*\n[ \t]*)to(?:[ \t]+|[ \t]*\n[ \t]*)proceed',
]
any = [
  { line_regex = ['^\s*❯?\s*1\.\s*Yes\b'] },
  { line_regex = ['^\s*❯?\s*2\.\s*Yes\b'] },
  { line_regex = ['^\s*❯?\s*3\.\s*Tell Claude\b'] },
]

[[rules]]
id = "login_method_prompt"
state = "blocked"
priority = 1200
region = "bottom_non_empty_lines(12)"
visible_blocker = true
contains = ["select login method:"]
line_regex = [
  '^\s*❯\s*1\.\s+Claude account with subscription',
  '^\s*2\.\s+Anthropic Console account',
  '^\s*3\.\s+3rd-party platform',
]

[[rules]]
id = "dynamic_workflow_prompt"
state = "blocked"
priority = 980
region = "whole_recent"
visible_blocker = true
contains = ["run a dynamic workflow?", "esc to cancel"]

[[rules]]
# These terminal failures leave the live prompt box visible. Priority 960 puts
# them above idle (950) but below every working rule so recovery clears the
# blocker even while the banner remains in the terminal buffer.
id = "auth_failure"
state = "blocked"
priority = 960
region = "bottom_non_empty_lines(12)"
visible_blocker = true
line_regex = ['^\s*❯\s*$']
any = [
  { line_regex = ['(?i)^\s*Invalid API key\s*·?\s*Please run /login\s*$'] },
  { line_regex = ['(?i)^\s*OAuth token (?:expired|revoked)\s*·?\s*Please run /login\s*$'] },
  { line_regex = ['(?i)^\s*Your session has expired\. Please run /login to sign in again\.\s*$'] },
  { line_regex = ['(?i)^\s*Credit balance (?:is )?too low\.?\s*$'] },
  { line_regex = ['(?i)^\s*Your account does not have access to Claude\. Please login again or contact your administrator\.\s*$'] },
]

[[rules]]
id = "api_error"
state = "blocked"
priority = 960
region = "bottom_non_empty_lines(12)"
visible_blocker = true
line_regex = ['^\s*❯\s*$']
any = [
  { line_regex = ['(?i)^\s*API Error(?::|\s*\().+$'] },
  { line_regex = ['(?i)^\s*Request timed out\.?\s*$'] },
  { line_regex = ['(?i)^\s*Agent terminated early due to an API error\.?\s*$'] },
]

[[rules]]
# Plan usage exhausted: the agent resumes when the window rolls. Keep this
# above the idle prompt while allowing working evidence to clear it.
id = "usage_limit_reached"
state = "blocked"
priority = 960
region = "bottom_non_empty_lines(8)"
visible_blocker = true
usage_limit = true
any = [
  { contains = ["hit your", "limit"], any = [
    { contains = ["limit resets"] },
    { contains = ["upgrade to increase your usage limit"] },
    { contains = ["resets at"] },
  ] },
  { contains = ["5-hour limit reached"] },
  { contains = ["weekly limit reached"] },
]

[[rules]]
id = "mcp_elicitation_prompt"
state = "blocked"
priority = 980
region = "whole_recent"
visible_blocker = true
# MCP elicitation dialogs (elicitation/create) show Accept/Decline controls
# with an "Esc to cancel" footer but no Enter hint, so live_blocked_form
# cannot see them (issue #3283). Gate on the invariant header line, the
# Accept/Decline control line, and the cancel footer.
contains = ["esc to cancel"]
line_regex = ['(?i)^\s*MCP server ["\x{201C}].+["\x{201D}] requests your input\s*$']
all = [
  { any = [
    { line_regex = ['^\s*\x{276F}?\s*Accept\b'] },
    { line_regex = ['^\s*\x{276F}?\s*Decline\b'] },
  ] },
]

[[rules]]
id = "live_prompt_box"
state = "idle"
priority = 950
region = "prompt_box_body"
visible_idle = true
line_regex = ['^\s*❯']
not = [
  { contains = ["enter to select"] },
  { contains = ["esc to cancel"] },
  { contains = ["tab/arrow keys"] },
  { contains = ["arrow keys to navigate"] },
  { contains = ["↑/↓ to navigate"] },
]

[[rules]]
id = "model_picker_menu"
state = "unknown"
priority = 900
region = "whole_recent"
skip_state_update = true
contains = ["select model", "enter to set as default", "esc to cancel"]
not = [
  { contains = ["do you want to proceed?"] },
  { contains = ["enter to select"] },
]

[[rules]]
id = "bash_permission_prompt"
state = "blocked"
priority = 850
region = "whole_recent"
visible_blocker = true
contains = ["do you want to proceed?"]
any = [
  { contains = ["bash command"] },
  { contains = ["bash("] },
  { contains = ["contains expansion"] },
  { contains = ["tab to amend"] },
  { contains = ["ctrl+e to explain"] },
]
# Claude marks the selected option with "❯", so every option branch has to allow
# that prefix. Numbered branches that omit it only match options the cursor has
# moved away from, which left the resting layout below unmatched here (#2650):
#   ❯ 1. Yes / 2. Yes, and don't ask again for: <cmd> / 3. No
# Cover both the two-option and "don't ask again" three-option shapes so this
# rule, not the narrower generic_permission_prompt, claims Bash approvals.
all = [
  { any = [
    { line_regex = ['(?i)^\s*❯?\s*yes\b'] },
    { line_regex = ['(?i)^\s*❯?\s*1\.\s*yes\b'] },
    { line_regex = ['(?i)^\s*❯?\s*2\.\s*yes\b'] },
    { line_regex = ['(?i)^\s*❯?\s*2\.\s*no\b'] },
    { line_regex = ['(?i)^\s*❯?\s*3\.\s*no\b'] },
  ] },
]

[[rules]]
id = "file_permission_prompt"
state = "blocked"
priority = 850
region = "after_last_horizontal_rule"
visible_blocker = true
# Write and Edit approvals ask "Do you want to create <file>?" or "Do you want
# to make this edit to <file>?" instead of "Do you want to proceed?", so only
# the non-visible legacy fallback caught them. Gate on that question
# (wrap-tolerant), the cancel footer, and at least one numbered option.
regex = ['(?i)do(?:[ \t]+|[ \t]*\n[ \t]*)you(?:[ \t]+|[ \t]*\n[ \t]*)want(?:[ \t]+|[ \t]*\n[ \t]*)to(?:[ \t]+|[ \t]*\n[ \t]*)(?:create|make(?:[ \t]+|[ \t]*\n[ \t]*)this(?:[ \t]+|[ \t]*\n[ \t]*)edit(?:[ \t]+|[ \t]*\n[ \t]*)to)']
contains = ["esc to cancel"]
any = [
  { line_regex = ['^\s*❯?\s*1\.\s*Yes\b'] },
  { line_regex = ['^\s*❯?\s*2\.\s*Yes\b'] },
  { line_regex = ['^\s*❯?\s*3\.\s*No\b'] },
]

[[rules]]
id = "generic_permission_prompt"
state = "blocked"
priority = 840
region = "after_last_horizontal_rule"
visible_blocker = true
contains = ["do you want to proceed?", "esc to cancel"]
all = [
  { any = [
    { line_regex = ['(?i)^\s*❯?\s*1\.\s*yes\b'] },
    { line_regex = ['(?i)^\s*2\.\s*yes\b'] },
    { line_regex = ['(?i)^\s*2\.\s*no\b'] },
    { line_regex = ['(?i)^\s*3\.\s*no\b'] },
  ] },
]

[[rules]]
id = "legacy_no_prompt_blocker"
state = "blocked"
priority = 300
region = "whole_recent"
any = [
  { contains = ["do you want to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
  { contains = ["would you like to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
  { contains = ["waiting for permission"] },
  { contains = ["do you want to allow this connection?"] },
  { contains = ["tab to amend"] },
  { contains = ["ctrl+e to explain"] },
  { contains = ["do you want to proceed?", "esc to cancel"] },
  { contains = ["review your answers"] },
  { contains = ["skip interview and plan immediately"] },
]
not = [
  { regex = ['(?m)^\s*❯\s*$'] },
]

[[rules]]
id = "osc_title_idle"
state = "idle"
priority = 250
region = "osc_title"
visible_idle = true
regex = ['^\x{2733} ']

[[rules]]
id = "osc_progress_idle"
state = "idle"
priority = 250
region = "osc_progress"
regex = ['^4;0']
