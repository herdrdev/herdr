id = "muse"
version = "2026.09.15.2"
min_engine_version = 2
updated_at = "2026-09-15T00:00:00Z"
aliases = ["muse-code", "muse-cli"]

# Evidence: live bottom-buffer captures from Muse Code 0.2.1 (original rules,
# local deterministic Responses provider) plus Muse Code 1.2.1 (2026-09-15
# refresh, live Herdr panes).
#
# 0.2.1 idle has a `⟩` prompt and `model · effort · cwd` footer. Active turns
# show `◆ Working (... · esc to interrupt)` or another activity label with the
# same interrupt hint.
#
# 1.2.1 changes the chrome: the prompt glyph is now `❯`, the footer is
# `model · effort · cwd` with new effort levels such as `max` and an optional
# fourth `· YOLO` segment, and active turns render
# `◆ <activity> — running (<elapsed> · esc to interrupt)` above the todo list.
# The composer (`❯` plus footer) stays rendered while working, so prompt
# shapes alone cannot prove idle; working evidence must outrank them. The todo
# block plus the voice-input banner, composer, separator, and footer push the
# running line more than 8 non-empty lines from the bottom, so the working
# window is 16 lines.
#
# Muse also drives a braille spinner OSC title prefix while a turn is active
# (`⠋ <label>`), cleared to a plain title when idle. Blocked question UI keeps
# the spinner, so the OSC working rule sits below every blocked rule.
#
# Structured questions show two co-occurring footer controls:
#   Enter to select · ↑/↓ to move · Tab for an optional note · Esc to interrupt
# Multi-select uses `Enter to toggle` instead. The paired controls distinguish a real picker
# from ordinary transcript text that happens to mention one action.
#
# First launch in an untrusted directory shows `Do you trust this workspace?` together with
# `Trust and continue`. This is a real blocker. User-opened `/theme` and `/skills` menus are
# not blockers; their paired footer controls identify overlays whose prior state must be kept.
#
# Muse 0.2.1 command approval shows `Allow this stage once` together with
# `Always allow in this workspace`. Muse 0.1 used `Allow once` with
# `Allow for this session`. Network approval shows `Yes, proceed` together with
# `Yes, don't ask again this session`. Each approval rule requires a pair because Muse can
# emit any one of these phrases as ordinary assistant text after a completed turn.
#
# While the main turn is parked awaiting background agents, Muse 1.2.1 shows no
# `esc to interrupt` line and clears the spinner title, so neither the working
# rule nor the OSC rule can fire. The background-task UI itself is the signal:
# the transcript shows `└ Running in background · /workflows to monitor`
# (replaced by `Finished ...` on completion) and the footer chrome shows
# `└ <spinner> workflow <name> · <id>  <n>/<m> agents done`. Both matchers are
# anchored on the `└` tree glyph so ordinary prose can never match, and the
# footer arm additionally requires a live braille spinner so a lingering
# completed row (which shows a static mark, not a spinner) cannot match.

[[rules]]
id = "workspace_trust_blocked"
state = "blocked"
priority = 970
region = "bottom_non_empty_lines(12)"
visible_blocker = true
contains = ["Do you trust this workspace?"]
any = [
  { contains = ["Trust and continue"] },
  { contains = ["Use Up/Down"] },
]

[[rules]]
id = "pick_request_blocked"
state = "blocked"
priority = 950
region = "bottom_non_empty_lines(8)"
visible_blocker = true
any = [
  { contains = ["Enter to select", "Tab for an optional note"] },
  { contains = ["Enter to toggle", "Esc to interrupt"] },
]

[[rules]]
id = "menu_overlay"
state = "unknown"
priority = 940
region = "bottom_non_empty_lines(8)"
skip_state_update = true
any = [
  { contains = ["enter confirm", "esc go back"] },
  { contains = ["enter save", "esc go back"] },
  { contains = ["space toggle", "esc close", "type filter"] },
]

[[rules]]
id = "working_esc_interrupt"
state = "working"
priority = 900
region = "bottom_non_empty_lines(16)"
visible_working = true
contains = ["esc to interrupt"]
not = [
  { contains = ["Enter to select", "Tab for an optional note"] },
  { contains = ["Enter to toggle", "Esc to interrupt"] },
  { contains = ["Allow this stage once", "Always allow in this workspace"] },
  { contains = ["Allow once", "Allow for this session"] },
  { contains = ["Yes, proceed", "Yes, don't ask again this session"] },
]

[[rules]]
id = "bg_tasks_working"
state = "working"
priority = 890
region = "bottom_non_empty_lines(16)"
visible_working = true
any = [
  { line_regex = ['^\s*└ Running in background'] },
  { line_regex = ['^\s*└ [\x{2800}-\x{28FF}] workflow .* agents done'] },
]

[[rules]]
id = "blocked_approval"
state = "blocked"
priority = 850
region = "bottom_non_empty_lines(8)"
visible_blocker = true
any = [
  { contains = ["Allow this stage once", "Always allow in this workspace"] },
  { contains = ["Allow once", "Allow for this session"] },
  { contains = ["Yes, proceed", "Yes, don't ask again this session"] },
]

[[rules]]
id = "osc_title_working"
state = "working"
priority = 800
region = "osc_title"
visible_working = true
regex = ['^[\x{2800}-\x{28FF}] ']

[[rules]]
id = "idle_prompt"
state = "idle"
priority = 700
region = "bottom_non_empty_lines(5)"
visible_idle = true
any = [
  { line_regex = ['^\s*⟩\s*$'] },
  { line_regex = ['^\s*⟩\s+\S'] },
  { line_regex = ['^\s*❯\s*$'] },
  { line_regex = ['^\s*❯\s+\S'] },
]
not = [
  { contains = ["esc to interrupt"] },
  { contains = ["Enter to select", "Tab for an optional note"] },
  { contains = ["Enter to toggle", "Esc to interrupt"] },
  { contains = ["enter confirm", "esc go back"] },
  { contains = ["enter save", "esc go back"] },
  { contains = ["space toggle", "esc close", "type filter"] },
]

[[rules]]
id = "idle_status_fallback"
state = "idle"
priority = 500
region = "bottom_non_empty_lines(3)"
visible_idle = true
line_regex = ['^\s*\S+ · (none|minimal|low|medium|high|xhigh|ultra|max) · ']
not = [{ contains = ["esc to interrupt"] }]
