name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  flake-check:
    if: github.repository == 'trungnt13/herdr'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Validate fork release tag
        run: python3 scripts/fork_release.py ci

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            always-allow-substitutes = true

      - name: Run Nix flake check
        run: |
          nix flake check --print-build-logs
          nix flake check --all-systems --no-build --print-build-logs

  build:
    if: github.repository == 'trungnt13/herdr'
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: herdr-linux-x86_64
            libghostty_vt_optimize: ReleaseFast
            libghostty_vt_simd: 'true'
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: herdr-linux-aarch64
            libghostty_vt_optimize: ReleaseFast
            libghostty_vt_simd: 'true'
          - target: x86_64-apple-darwin
            os: macos-latest
            name: herdr-macos-x86_64
            libghostty_vt_optimize: ReleaseFast
            libghostty_vt_simd: 'true'
          - target: aarch64-apple-darwin
            os: macos-latest
            name: herdr-macos-aarch64
            libghostty_vt_optimize: ReleaseFast
            libghostty_vt_simd: 'true'
    runs-on: ${{ matrix.os }}
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ${{ matrix.libghostty_vt_optimize }}
      LIBGHOSTTY_VT_SIMD: ${{ matrix.libghostty_vt_simd }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Validate fork release tag
        run: python3 scripts/fork_release.py ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install Zig
        if: runner.os != 'macOS'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Restore Homebrew Zig cache
        if: runner.os == 'macOS'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: homebrew-zig-0.15-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            homebrew-zig-0.15-${{ runner.os }}-

      - name: Install patched Zig on macOS
        if: runner.os == 'macOS'
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install zig@0.15
          echo "$(brew --prefix zig@0.15)/bin" >> "$GITHUB_PATH"
          test "$("$(brew --prefix zig@0.15)/bin/zig" version)" = 0.15.2

      - name: Prefer official Ubuntu mirrors over Azure
        if: runner.os == 'Linux'
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt
            echo "Using apt mirrors:"
            cat /etc/apt/apt-mirrors.txt
          fi

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo find /etc/apt/sources.list.d -type f \( -iname '*microsoft*' -o -iname '*azure-cli*' \) -print -delete
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build musl-tools gcc-aarch64-linux-gnu crossbuild-essential-arm64

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja

      - name: Set Linux aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: release-${{ matrix.target }}

      - name: Remove Zig caches
        shell: bash
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package artifact
        shell: bash
        run: cp target/${{ matrix.target }}/release/herdr ${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
          if-no-files-found: error

  validate-release-inputs:
    if: github.repository == 'trungnt13/herdr'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate fork release tag
        run: python3 scripts/fork_release.py ci

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Validate release inputs
        run: |
          python3 scripts/changelog.py validate-product-announcement
          python3 scripts/agent_detection_manifest_check.py --require-all-published
          python3 scripts/config_reference_check.py
          node scripts/docs/versions.mjs check
          node scripts/docs/preview.mjs check
          bun test scripts/docs/*.test.ts
          test -f docs/next/README.md
          test -f docs/next/README.zh-CN.md

  release:
    needs: [build, flake-check, validate-release-inputs]
    if: github.repository == 'trungnt13/herdr'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Validate fork release tag
        run: python3 scripts/fork_release.py ci

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8

      - name: Extract release notes and warn about upstream updates
        run: |
          python3 scripts/changelog.py extract --version "${GITHUB_REF_NAME#v}" --output RELEASE_NOTES.md
          cat >> RELEASE_NOTES.md <<'EOF'

          **Fork prerelease: manual installation only.** The updater still targets upstream
          Herdr. Do not run `herdr update` to install or upgrade this fork. Fork automatic
          updates are not supported; `+fork.N` does not affect SemVer precedence.
          EOF

      - name: Verify four artifacts and generate checksums
        run: |
          mkdir release-assets
          for name in herdr-linux-aarch64 herdr-linux-x86_64 herdr-macos-aarch64 herdr-macos-x86_64; do
            test -s "$name/$name"
            test "$(find "$name" -type f | wc -l)" -eq 1
            cp "$name/$name" release-assets/
          done
          cd release-assets
          sha256sum herdr-linux-aarch64 herdr-linux-x86_64 herdr-macos-aarch64 herdr-macos-x86_64 > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Reject existing releases and draft reservations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --hostname github.com --paginate --jq '.[].tag_name' 'repos/trungnt13/herdr/releases?per_page=100' > "$RUNNER_TEMP/fork-release-tags.txt"
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          tags = (Path(os.environ["RUNNER_TEMP"]) / "fork-release-tags.txt").read_text().splitlines()
          if os.environ["GITHUB_REF_NAME"] in tags:
              raise SystemExit("Release or draft already exists; inspect it before any explicitly approved cleanup or retry")
          PYTHON

      - name: Stage draft prerelease
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          files: |
            release-assets/herdr-linux-x86_64
            release-assets/herdr-linux-aarch64
            release-assets/herdr-macos-x86_64
            release-assets/herdr-macos-aarch64
            release-assets/SHA256SUMS
          body_path: RELEASE_NOTES.md
          draft: true
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          overwrite_files: false

      - name: Publish completed prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo trungnt13/herdr --draft=false --prerelease --latest=false
