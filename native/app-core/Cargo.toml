[package]
name = "shepherd-app-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Toolkit-free core of the native Shepherd app: server endpoint client and state models"

[dependencies]
bincode = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10.0"
shepherd-core = { path = "../../crates/shepherd-core" }
notify = "8" # refresh the panels when a state file changes instead of polling
